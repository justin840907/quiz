<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>孟勳餞別問答</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：單一深色「宴會投影」視覺；主持人用投影機、大家用手機。 */
:root {
  --bg: #0e0c0b; --panel: #1a1614; --line: #3a312a;
  --fg: #f3e9d8; --muted: #a8977f; --gold: #d9b26f; --gold-deep: #a9823f;
  --ok: #7fc48a; --bad: #e07a6a;
  --display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --body: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; }
* { box-sizing: border-box; }
button, input { font: inherit; }
.view { max-width: 1100px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding-block: 24px 40px; gap: 24px; }
.view.narrow { max-width: 560px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: clamp(34px, 6vw, 72px); font-weight: 900; letter-spacing: .08em; }
h2 { font-size: clamp(24px, 4vw, 44px); font-weight: 700; }
.eyebrow { font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.muted { color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.sp { flex: 1; }
.btn { background: var(--gold); color: #1a1208; border: 0; border-radius: 999px; padding: 12px 24px; font-weight: 700; cursor: pointer; letter-spacing: .06em; }
.btn:hover { background: #e6c384; }
.btn:focus-visible, .opt:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.btn.ghost { background: transparent; color: var(--gold); border: 1px solid var(--gold-deep); }
.btn.big { font-size: 22px; padding: 18px 40px; }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
input[type=text], input[type=number] { background: #0a0908; color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; width: 100%; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tabs a { color: var(--muted); text-decoration: none; padding: 8px 14px; border-radius: 999px; border: 1px solid transparent; font-weight: 500; }
.tabs a.on { color: var(--gold); border-color: var(--gold-deep); }

/* 首頁 QR */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 32px; align-items: center; }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; } }
.qrbox { background: #fff; padding: 18px; border-radius: 16px; width: fit-content; justify-self: center; }
.qrbox canvas, .qrbox img { display: block; }
.steps { display: grid; gap: 10px; counter-reset: s; }
.steps div { display: flex; gap: 14px; align-items: baseline; }
.steps div::before { counter-increment: s; content: counter(s); font-family: var(--display); font-weight: 900; color: var(--gold); font-size: 28px; min-width: 1.2em; }

/* 題目 */
.qnum { font-family: var(--display); color: var(--gold); font-size: 15px; letter-spacing: .3em; }
.qtext { font-family: var(--display); font-size: clamp(22px, 3.4vw, 40px); font-weight: 700; line-height: 1.3; }
.opts { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.opt { text-align: left; background: #0a0908; color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; cursor: pointer; font-size: 18px; display: flex; gap: 14px; align-items: center; transition: border-color .15s, transform .15s; }
.opt:hover { border-color: var(--gold-deep); }
.opt b { font-family: var(--display); color: var(--gold); font-size: 22px; min-width: 1.2em; }
.opt.picked { border-color: var(--gold); background: #231d16; }
.opt.right { border-color: var(--ok); background: #14241a; }
.opt.wrong { border-color: var(--bad); background: #2a1715; }
.opt.dim { opacity: .45; }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--gold); transition: width .3s; }
.why { color: var(--muted); font-size: 17px; border-left: 3px solid var(--gold); padding-left: 14px; }

/* 成績 */
.score { font-family: var(--display); font-size: clamp(80px, 20vw, 180px); font-weight: 900; line-height: 1; color: var(--gold); font-variant-numeric: tabular-nums; }
.score small { font-size: .3em; color: var(--muted); font-weight: 500; letter-spacing: .1em; }
.code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 30px; letter-spacing: .25em; background: #0a0908; border: 1px dashed var(--gold-deep); border-radius: 12px; padding: 14px 18px; text-align: center; }
.review { display: grid; gap: 8px; }
.review div { display: flex; gap: 10px; align-items: baseline; font-size: 15px; }
.review .r { color: var(--ok); } .review .w { color: var(--bad); }

/* 統計 */
.stats { display: grid; grid-template-columns: 1.1fr 1fr; gap: 24px; }
@media (max-width: 860px) { .stats { grid-template-columns: 1fr; } }
.board { display: grid; gap: 8px; }
.board .p { display: grid; grid-template-columns: 2.2em 1fr auto; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 10px; background: #0a0908; border: 1px solid var(--line); }
.board .p.top { border-color: var(--gold); background: #231d16; }
.board .rank { font-family: var(--display); font-weight: 900; color: var(--gold); font-size: 22px; }
.board .pts { font-variant-numeric: tabular-nums; font-weight: 700; }
.board .p button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 14px; }
.hist { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; align-items: end; height: 180px; }
.hist .bar { background: var(--gold-deep); border-radius: 6px 6px 0 0; position: relative; min-height: 3px; display: flex; align-items: flex-start; justify-content: center; transition: height .3s; }
.hist .bar span { position: absolute; top: -22px; font-size: 13px; color: var(--fg); font-variant-numeric: tabular-nums; }
.hist .bar.hot { background: var(--gold); }
.histx { display: grid; grid-template-columns: repeat(8, 1fr); text-align: center; font-size: 13px; color: var(--muted); }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: #0a0908; color: var(--fg); cursor: pointer; font-weight: 700; }
.pill.on { background: var(--gold); color: #1a1208; border-color: var(--gold); }
.kpi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.kpi div { background: #0a0908; border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.kpi b { display: block; font-family: var(--display); font-size: 34px; color: var(--gold); font-variant-numeric: tabular-nums; }
.kpi span { font-size: 13px; color: var(--muted); }
.qdiff { display: grid; gap: 6px; font-size: 14px; }
.qdiff div { display: grid; grid-template-columns: 2.5em 1fr 4em; gap: 10px; align-items: center; }
.qdiff i { display: block; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.qdiff i b { display: block; height: 100%; background: var(--ok); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--gold); color: #1a1208; padding: 10px 18px; border-radius: 999px; font-weight: 700; opacity: 0; transition: opacity .25s; pointer-events: none; }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
/* 計時 */
.timer { position: relative; min-width: 140px; height: 48px; border-radius: 22px; background: #0a0908; border: 1px solid var(--line); overflow: hidden; display: flex; align-items: center; justify-content: center; }
.timer i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--gold-deep); opacity: .35; transition: width .1s linear; }
.timer b { position: relative; font-family: var(--display); font-size: 24px; color: var(--gold); font-variant-numeric: tabular-nums; }
.timer.shown b { color: var(--muted); }
.verdict { font-family: var(--display); font-size: clamp(36px, 8vw, 64px); font-weight: 900; letter-spacing: .1em; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }

/* 頒獎 */
.scene.award { background: radial-gradient(ellipse at 50% 30%, #2a2113 0%, #0e0c0b 65%); }
.award-wrap { position: relative; min-height: 100%; display: grid; place-items: center; text-align: center; }
.award-title { font-family: var(--display); font-size: clamp(40px, 7vw, 96px); font-weight: 900; letter-spacing: .3em; margin-left: .3em; color: #fff; }
.award-sub { color: var(--gold); letter-spacing: .4em; font-size: 18px; margin-top: 16px; }
.medal { font-family: var(--display); font-size: clamp(22px, 3vw, 36px); letter-spacing: .5em; margin-left: .5em; color: var(--gold); }
.winner { font-family: var(--display); font-size: clamp(64px, 12vw, 200px); font-weight: 900; line-height: 1.1; color: #fff; text-shadow: 0 0 60px rgba(217,178,111,.45); animation: pop .7s cubic-bezier(.2,1.4,.3,1) both; }
.winner.gold { background: linear-gradient(180deg, #fff3d1, #d9b26f 60%, #a9823f); -webkit-background-clip: text; background-clip: text; color: transparent; }
.wscore { font-family: var(--display); font-size: clamp(24px, 4vw, 48px); color: var(--muted); margin-top: 8px; font-variant-numeric: tabular-nums; animation: pop .7s .15s cubic-bezier(.2,1.4,.3,1) both; }
.podium { display: flex; gap: 28px; justify-content: center; align-items: flex-end; margin-top: 48px; flex-wrap: wrap; }
.podium .pd { display: grid; gap: 6px; justify-items: center; opacity: .75; }
.podium .pd b { font-family: var(--display); font-size: 26px; color: #fff; }
.podium .pd i { font-style: normal; font-size: 13px; letter-spacing: .3em; color: var(--gold); }
.podium .pd span { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.award-hint { position: fixed; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); text-align: center; color: var(--muted); font-size: 13px; letter-spacing: .2em; }
#confetti { position: fixed; inset: 0; pointer-events: none; }
@keyframes pop { from { opacity: 0; transform: scale(.6) translateY(30px); filter: blur(10px); } to { opacity: 1; transform: none; filter: none; } }
@media (prefers-reduced-motion: reduce) { .winner, .wscore { animation: none; } }
</style>

<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* 題目資料在上面的 quizdata 區塊；主持人可在頁面的「編輯題目」分頁修改並發布 */
let QUIZ = JSON.parse(document.getElementById('quizdata').textContent);

/* 大家掃 QR 要連到的網址。留空時用本頁網址；主持人也可以在首頁貼上分享連結。 */
const SHARE_URL = '';

const $ = s => document.querySelector(s);
const app = $('#app');
const L = 'ABCD';
let N = QUIZ.length;
const mem = {};
const store = { get(k, d) { if (k in mem) return mem[k]; try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };
let toastT; const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// 成績碼：N 位數字（每題選的選項 1–4），主持人輸入後可算每題答對率
const QSEC = 20;                 // 每題作答秒數（Kahoot 式）
const PTS_MAX = 1000, PTS_MIN = 500; // 答對依速度給 500–1000 分
const ptsFor = (ms) => Math.round(PTS_MAX - (PTS_MAX - PTS_MIN) * Math.min(1, Math.max(0, ms / (QSEC * 1000))));
const encode = picks => picks.map(p => p == null ? 0 : p + 1).join('');
const decode = code => new RegExp('^[0-4]{' + N + '}$').test(code) ? [...code].map(c => +c === 0 ? null : +c - 1) : null;
const scoreOf = picks => picks.reduce((s, p, i) => s + (p === QUIZ[i].ans ? 1 : 0), 0);

// ───────── 路由 ─────────
const route = () => (location.hash.replace('#', '') || 'play');
window.addEventListener('hashchange', render);
function nav(h) { location.hash = h; }
function tabs(cur) {
  const t = [['host', '首頁 QR'], ['reveal', '出題'], ['stats', '統計分數'], ['award', '頒獎'], ['edit', '編輯題目']];
  return `<nav class="tabs">${t.map(([h, l]) => `<a href="#${h}" class="${cur === h ? 'on' : ''}">${l}</a>`).join('')}<a href="#play">手機作答頁</a></nav>`;
}

// ───────── 首頁（投影）─────────
function viewHost() {
  const url = store.get('shareUrl', SHARE_URL) || location.href.split('#')[0];
  app.innerHTML = `<div class="view">
    ${tabs('host')}
    <div class="hero">
      <div style="display:grid;gap:18px">
        <div class="eyebrow">孟勳餞別會 · 現場問答</div>
        <h1>你有多了解<br>孟勳？</h1>
        <p class="muted" style="font-size:18px;max-width:34em">${N} 題，全部出自剛剛那支影片。掃右邊的 QR code 加入，跟著投影幕一題一題作答，答對越快分數越高。</p>
        <div class="steps">
          <div>掃描 QR code，輸入你的名字</div>
          <div>每題 ${QSEC} 秒，跟著主持人一題一題作答</div>
          <div>把成績畫面拿給主持人，上排行榜</div>
        </div>
        <div class="row"><a class="btn" href="#reveal">開始出題 →</a><a class="btn ghost" href="#stats">統計分數</a></div>
      </div>
      <div style="display:grid;gap:10px;justify-items:center">
        <div class="qrbox" id="qr"></div>
        <div class="muted" style="font-size:13px;word-break:break-all;max-width:280px;text-align:center" id="qrurl">${esc(url)}</div>
      </div>
    </div>
    <details class="panel" style="padding:14px 18px"><summary class="muted">QR 連到別的網址？</summary>
      <div class="row" style="margin-top:10px"><input type="text" id="shareUrl" value="${esc(store.get('shareUrl', SHARE_URL))}" placeholder="貼上這個頁面的分享連結"><button class="btn ghost" id="saveUrl">更新 QR</button></div>
      <p class="muted" style="font-size:13px;margin:10px 0 0">請先在右上角「分享」把這個頁面設成「任何有連結的人都能看」，手機才打得開。</p>
    </details>
  </div>`;
  if (window.QRCode) new QRCode($('#qr'), { text: url, width: 260, height: 260, correctLevel: QRCode.CorrectLevel.M }); else $('#qr').innerHTML = '<div style="color:#333;width:260px;text-align:center">QR 產生器載入失敗，請重新整理</div>';
  $('#saveUrl').onclick = () => { store.set('shareUrl', $('#shareUrl').value.trim()); render(); toast('QR 已更新'); };
}

// ───────── 公布答案／主持模式（投影）─────────
let rv = { i: 0, phase: 'ready', t0: 0 }; // ready → running → shown
let rvTimer = null;
function viewReveal() {
  const q = QUIZ[rv.i];
  clearInterval(rvTimer);
  const left = rv.phase === 'running' ? Math.max(0, QSEC - (Date.now() - rv.t0) / 1000) : QSEC;
  app.innerHTML = `<div class="view">
    ${tabs('reveal')}
    <div class="progress"><i style="width:${(rv.i + (rv.phase === 'shown' ? 1 : .5)) / N * 100}%"></i></div>
    <div class="row"><div class="qnum">第 ${rv.i + 1} 題 / ${N}</div><span class="sp"></span>
      <div class="timer ${rv.phase}" id="timer"><b id="tleft">${Math.ceil(left)}</b><i style="width:${left / QSEC * 100}%"></i></div></div>
    <div class="qtext">${esc(q.q)}</div>
    <div class="opts">${q.opts.map((o, k) => `<div class="opt ${rv.phase === 'shown' ? (k === q.ans ? 'right' : 'dim') : ''}"><b>${L[k]}</b><span>${esc(o)}</span></div>`).join('')}</div>
    ${rv.phase === 'shown' ? `<div class="why">${esc(q.why)}</div>` : `<p class="muted" style="margin:0">${rv.phase === 'ready' ? '請大家在手機上按「準備好了」，然後按「開始計時」。' : '作答中… 時間到或按「公布答案」。'}</p>`}
    <div class="row">
      <button class="btn ghost" id="prev" ${rv.i === 0 ? 'disabled' : ''}>← 上一題</button>
      <span class="sp"></span>
      ${rv.phase === 'ready' ? `<button class="btn big" id="start">開始計時（${QSEC} 秒）</button>` : rv.phase === 'running' ? `<button class="btn big" id="show">公布答案</button>` : (rv.i < N - 1 ? `<button class="btn big" id="next">下一題 →</button>` : `<a class="btn big" href="#stats">看統計分數 →</a>`)}
    </div>
  </div>`;
  const b = (id, f) => { const e = $(id); if (e) e.onclick = f; };
  b('#start', () => { rv.phase = 'running'; rv.t0 = Date.now(); render(); });
  b('#show', () => { rv.phase = 'shown'; render(); });
  b('#next', () => { rv.i++; rv.phase = 'ready'; render(); });

let aw = { step: 0 };
const RANKS = ['第三名', '第二名', '第一名'];
function viewAward() {
  const rows = store.get('results', []);
  const sorted = [...rows].sort((a, b) => b.score - a.score || a.t - b.t);
  const top = sorted.slice(0, 3);            // top[0]=第一名

    body = `<div>

    </div>`;
  }
  const done = top.length && aw.step >= steps;
  app.innerHTML = `<div class="view" style="min-height:100%">${tabs('award')}<div class="award-wrap" id="awArea">${body}</div></div>
    <canvas id="confetti"></canvas>
    <div class="award-hint">${!top.length ? '' : done ? '恭喜！ · 空白鍵或點一下重來' : '點畫面或按空白鍵 → 下一位'}</div>`;
  const advance = () => { if (!top.length) return; aw.step = done ? 0 : aw.step + 1; render(); };
  $('#awArea').onclick = advance;
  document.onkeydown = e => { if (route() !== 'award' || e.target.tagName === 'INPUT') return; if (e.code === 'Space' || e.key === 'ArrowRight') { e.preventDefault(); advance(); } };

  const c = $('#confetti'); if (!c) return; c.width = innerWidth; c.height = innerHeight; const ctx = c.getContext('2d');
  const cols = ['#d9b26f', '#fff3d1', '#e07a6a', '#7fc48a', '#ffffff', '#a9823f'];
  const ps = Array.from({ length: n }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, r: 4 + Math.random() * 6, vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 3, a: Math.random() * 6.28, va: (Math.random() - .5) * .2, col: cols[Math.floor(Math.random() * cols.length)] }));
  let t0 = performance.now(); const life = big ? 6000 : 3000;
  const tick = now => {
    if (!document.body.contains(c)) return; ctx.clearRect(0, 0, c.width, c.height);
    for (const p of ps) { p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.col; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); if (p.y > c.height + 20) { p.y = -20; p.x = Math.random() * c.width; } }
    if (now - t0 < life) requestAnimationFrame(tick); else ctx.clearRect(0, 0, c.width, c.height);
  };
  requestAnimationFrame(tick);
}

function render() {
  const r = route();
  window.scrollTo(0, 0);
  if (r === 'host') viewHost(); else if (r === 'reveal') viewReveal(); else if (r === 'stats') viewStats(); else if (r === 'edit') viewEdit(); else if (r === 'award') viewAward(); else viewPlay();
}
render();
</script>
